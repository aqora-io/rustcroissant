name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check (arrow-${{ matrix.arrow }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arrow: ["56", "57", "58"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88
          components: rustfmt,clippy
          cache: true
          cache-key: arrow-${{ matrix.arrow }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --no-default-features --features "convert,arrow-${{ matrix.arrow }}" -- -D warnings

      - name: Build
        run: cargo build --no-default-features --features "convert,arrow-${{ matrix.arrow }}"

      - name: Test
        run: cargo test --no-default-features --features "convert,arrow-${{ matrix.arrow }}"
