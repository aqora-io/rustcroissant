[package]
name = "rustcroissant"
version = "0.0.0"
edition = "2024"
readme = "README.md"

[lib]
name = "rustcroissant"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
anyhow = "1"
biblatex = { version = "0.11.0", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
csv = "1.3"
derive_builder = "0.20.2"
garde = { version = "0.22.1", features = ["full"] }
hex = "0.4"
miette = { version = "7.6.0", features = ["fancy"] }
path-clean = "1"
rand = "0.9.1"
relative-path = { version = "2.0.1", features = ["serde"] }
schematic = { path = "../schematic/crates/schematic", features = [
  "type_regex",
  "type_url",
  "renderer_json_schema",
  "json",
  "type_chrono",
  "validate_url",
  "type_semver",
  "type_relative_path",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
url = { version = "2.5.7", features = ["serde"] }


[build-dependencies]
chrono = "0.4"
